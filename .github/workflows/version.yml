name: Version

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref or SHA to version
        required: false
        type: string
    outputs:
      semver:
        description: GitVersion SemVer
        value: ${{ jobs.version.outputs.semver }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.x

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Output version
        run: echo "semver=${{ steps.gitversion.outputs.semVer }}"
