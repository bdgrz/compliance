name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # The app build bundles the SPA.
      - uses: actions/setup-node@v7 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: dotnet restore Compliance.slnx --locked-mode

      - name: Format
        run: dotnet format whitespace Compliance.slnx --verify-no-changes

      - name: Build
        run: dotnet build Compliance.slnx --configuration Release --no-restore

      # Broker tests share one broker stack (test/Compliance.Tests/E2E/compose.yml) and run in parallel.
      - name: Test
        run: dotnet test Compliance.slnx --configuration Release --no-build --no-restore
