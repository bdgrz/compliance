name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - run: dotnet restore Compliance.slnx --locked-mode

      - name: Format
        run: dotnet format whitespace Compliance.slnx --verify-no-changes --no-restore

  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # The app build bundles the SPA.
      - uses: actions/setup-node@v7 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: dotnet restore Compliance.slnx --locked-mode

      - name: Build
        run: dotnet build Compliance.slnx --configuration Release --no-restore

      # Unit tests only. The broker suite (Category=BrokerIntegration) is a local gate:
      # ./scripts/check-backend.sh full
      - name: Test
        run: dotnet test Compliance.slnx --configuration Release --no-build --no-restore --filter "Category!=BrokerIntegration"

  validate:
    name: Validate
    if: always()
    needs:
      - format
      - build-test
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a validation lane did not succeed
        if: ${{ needs.format.result != 'success' || needs.build-test.result != 'success' }}
        run: exit 1

      - name: Record aggregate success
        if: ${{ needs.format.result == 'success' && needs.build-test.result == 'success' }}
        run: echo "Format and build/test checks passed."
